name: fetch-logos
on:
  push:
    paths:
      - "data/logos.json"
      - "scripts/fetch_logos.py"
      - ".github/workflows/fetch-logos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/fetch_logos.py
      - name: Commit results
        run: |
          git config user.name "diuvita-bot"
          git config user.email "noreply@diuvita.com"
          git add assets/logos
          git diff --cached --quiet || git commit -m "bot: logos descargados/actualizados [skip ci]"
          git push
