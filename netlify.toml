[build]
  command = "python3 scripts/validate_data.py && DIUVITA_DATA_SOURCE=supabase python3 build.py && python3 scripts/check_operational_limits.py --built-site"
  publish = "dist"

[[redirects]]
  from = "https://diuvita.com/*"
  to = "https://www.diuvita.com/:splat"
  status = 301
  force = true
